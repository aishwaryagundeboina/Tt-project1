spring.application.name=campus-connect-backend

server.port=${PORT:8080}

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:campus_connect;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=aVeryLongSecretKeyThatIsDefinitelyLongEnoughToSatisfyTheHS512AlgorithmRequirement1234567890aVeryLongSecretKeyThatIsDefinitelyLongEnoughToSatisfyTheHS512AlgorithmRequirement1234567890aVeryLongSecretKeyThatIsDefinitelyLongEnoughToSatisfyTheHS512AlgorithmRequirement1234567890
jwt.expirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
